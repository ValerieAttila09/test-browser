<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fullscreen Activity Monitor</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
      padding: 24px;
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    button {
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      background-color: #2563eb;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    button:hover {
      background-color: #1d4ed8;
    }

    button:active {
      transform: scale(0.97);
    }

    button.secondary {
      background-color: #334155;
    }

    button.secondary:hover {
      background-color: #475569;
    }

    .panel {
      width: 100%;
      max-width: 540px;
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      margin-bottom: 12px;
      border-bottom: 1px solid #334155;
      font-size: 14px;
    }

    .badge {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background-color: #334155;
      color: #cbd5e1;
    }

    .badge.active {
      background-color: #065f46;
      color: #6ee7b7;
    }

    .badge.warning {
      background-color: #7f1d1d;
      color: #fca5a5;
    }

    #log-list {
      list-style: none;
      max-height: 220px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 13px;
    }

    #log-list li {
      padding: 8px 10px;
      border-radius: 6px;
      background-color: #0f172a;
      border-left: 3px solid #3b82f6;
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    #log-list li.alert {
      border-left-color: #ef4444;
      color: #fecaca;
    }

    .time {
      color: #64748b;
      font-family: monospace;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <div class="controls">
    <button id="fullscreen-btn">Mulai Fullscreen</button>
    <button id="clear-btn" class="secondary">Reset Log</button>
  </div>

  <div class="panel">
    <div class="status-bar">
      <span>Status: <strong id="status-text" class="badge">Standby</strong></span>
      <span>Peringatan: <strong id="alert-count" class="badge warning">0</strong></span>
    </div>
    <ul id="log-list">
      <li><span>Klik "Mulai Fullscreen" untuk mulai memantau aktivitas.</span></li>
    </ul>
  </div>

  <script>
    const btn = document.getElementById('fullscreen-btn');
    const clearBtn = document.getElementById('clear-btn');
    const statusText = document.getElementById('status-text');
    const alertCountEl = document.getElementById('alert-count');
    const logList = document.getElementById('log-list');

    let isSessionActive = false;
    let alertCount = 0;
    let lastBlurTime = 0;

    function getTimestamp() {
      return new Date().toLocaleTimeString('id-ID', { hour12: false });
    }

    function addLog(message, isAlert = false) {
      const li = document.createElement('li');
      if (isAlert) {
        li.classList.add('alert');
        alertCount++;
        alertCountEl.textContent = alertCount;
      }
      li.innerHTML = `<span>${message}</span><span class="time">${getTimestamp()}</span>`;
      logList.prepend(li);
    }

    btn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen()
          .then(() => {
            isSessionActive = true;
          })
          .catch((err) => {
            addLog(`Gagal masuk fullscreen: ${err.message}`, true);
          });
      } else {
        document.exitFullscreen();
      }
    });

    clearBtn.addEventListener('click', () => {
      alertCount = 0;
      alertCountEl.textContent = '0';
      logList.innerHTML = '<li><span>Log dibersihkan.</span></li>';
    });

    // 1. Deteksi masuk / keluar mode fullscreen
    document.addEventListener('fullscreenchange', () => {
      if (document.fullscreenElement) {
        btn.textContent = 'Exit Fullscreen';
        statusText.textContent = 'Fullscreen Aktif';
        statusText.className = 'badge active';
        addLog('Masuk ke mode fullscreen');
      } else {
        btn.textContent = 'Mulai Fullscreen';
        statusText.textContent = 'Keluar Fullscreen';
        statusText.className = 'badge warning';
        if (isSessionActive) {
          addLog('Pengguna keluar dari mode fullscreen!', true);
        }
      }
    });

    // 2. Deteksi pindah tab atau minimize browser
    document.addEventListener('visibilitychange', () => {
      if (!isSessionActive) return;

      if (document.hidden) {
        addLog('Terdeteksi pindah tab atau minimize browser!', true);
      } else {
        addLog('Pengguna kembali ke tab ini');
      }
    });

    // 3. Deteksi fokus keluar dari jendela browser (Alt+Tab / klik aplikasi lain)
    window.addEventListener('blur', () => {
      if (!isSessionActive) return;

      // Cegah duplikasi log jika blur dipicu bersamaan dengan pindah tab
      const now = Date.now();
      setTimeout(() => {
        if (!document.hidden && now - lastBlurTime > 300) {
          addLog('Fokus keluar dari jendela browser (Alt+Tab / aplikasi lain)!', true);
        }
      }, 100);
      lastBlurTime = now;
    });

    window.addEventListener('focus', () => {
      if (isSessionActive && !document.hidden) {
        addLog('Fokus kembali ke jendela browser');
      }
    });
  </script>

</body>
</html>
